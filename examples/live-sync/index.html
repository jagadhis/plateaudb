<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>live-sync: orders on plateau</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem; color: #1b1f24; }
      h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
      #status { color: #57606a; margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
      table { border-collapse: collapse; width: 100%; max-width: 60rem; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: .2rem .6rem; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
      @media (max-width: 600px) { body { margin: .75rem; } th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5) { display: none; } }
      th { color: #57606a; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Orders <span id="count"></span></h1>
    <div id="status">starting</div>
    <table>
      <thead><tr><th>id</th><th>title</th><th>customer</th><th>status</th><th>total</th><th>v</th><th>updated</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="./src/main.ts"></script>
